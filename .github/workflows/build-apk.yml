name: Construire APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compiler l’APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: Ret-holl2-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
